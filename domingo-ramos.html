

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Domingo de Ramos | Semana Santa de Málaga</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #080808;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at center, #202020 0%, #0b0b0b 58%, #050505 100%);
      color: #e8dfcd;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .pagina {
      width: 100%;
      max-width: 1050px;
      min-height: 75vh;
      border: 1px solid #a98a50;
      outline: 1px solid rgba(169, 138, 80, 0.25);
      outline-offset: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 24px 28px;
      position: relative;
      text-align: center;
      background: rgba(0, 0, 0, 0.28);
    }

    .sobretitulo {
      color: #b99b62;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      color: #d5b779;
      font-size: clamp(27px, 5vw, 46px);
      font-weight: normal;
      letter-spacing: 4px;
      margin: 0 0 12px;
      text-transform: uppercase;
    }

    .subtitulo {
      color: #d1c5af;
      font-size: clamp(14px, 2vw, 18px);
      font-style: italic;
      margin: 0 0 27px;
    }

    .marco-foto {
      width: 100%;
      max-width: 760px;
      border: 1px solid #a98a50;
      padding: 7px;
      background: #050505;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .foto-pregonero {
      display: block;
      width: 100%;
      height: auto;
      max-height: 55vh;
      min-height: 220px;
      object-fit: contain;
      background: #080808;
    }

    .pie-foto {
      color: #bca878;
      font-size: 13px;
      letter-spacing: 1px;
      margin: 17px 0 24px;
    }

    .boton-sonido {
      border: 1px solid #b99b62;
      background: transparent;
      color: #e1c78f;
      padding: 13px 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }

    .boton-sonido:hover {
      background: #b99b62;
      color: #080808;
    }

    .estado {
      min-height: 20px;
      color: #b9ad98;
      font-size: 12px;
      margin: 12px 0 0;
    }

    .enlace-pregon {
      color: #bca878;
      font-size: 12px;
      margin-top: 10px;
      text-decoration: none;
    }

    .enlace-pregon:hover {
      color: #f0d8a1;
      text-decoration: underline;
    }

    .volver {
      position: absolute;
      left: 20px;
      bottom: 18px;
      color: #c4a76c;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .volver:hover {
      color: #f0d8a1;
    }

    .pie-pagina {
      color: #77684d;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 30px;
      text-align: center;
      text-transform: uppercase;
    }

    /* Reproductor de sonido de YouTube */
    .reproductor-oculto {
      position: fixed;
      width: 2px;
      height: 2px;
      left: 0;
      bottom: 0;
      opacity: 0.01;
      overflow: hidden;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 13px;
      }

      .pagina {
        min-height: 80vh;
        padding: 28px 14px 65px;
      }

      .sobretitulo {
        letter-spacing: 3px;
      }

      h1 {
        letter-spacing: 2px;
      }

      .marco-foto {
        padding: 4px;
      }

      .foto-pregonero {
        min-height: 180px;
        max-height: 45vh;
      }

      .volver {
        left: 14px;
        bottom: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <div class="sobretitulo">Semana Santa de Málaga</div>

    <h1>Domingo de Ramos</h1>

    <p class="subtitulo">
      La palabra de un cofrade malagueño
    </p>

    <div class="marco-foto">
      <img
        class="foto-pregonero"
        src="https://img.youtube.com/vi/-71YPdoL3ZU/hqdefault.jpg"
        alt="Imagen del pregón de Antonio Banderas"
        onerror="this.style.display='none';"
      >
    </div>

    <p class="pie-foto">
      Antonio Banderas · Pregonero de Málaga · 2011
    </p>

    <button
      class="boton-sonido"
      id="botonSonido"
      type="button"
      onclick="reproducirPregon()"
    >
      ▶ Escuchar el pregón
    </button>

    <p class="estado" id="estadoSonido">
      Pulsa el botón para escuchar la voz original del pregonero.
    </p>

    <a
      class="enlace-pregon"
      href="https://www.youtube.com/watch?v=-71YPdoL3ZU"
      target="_blank"
      rel="noopener noreferrer"
    >
      Abrir el pregón completo en YouTube
    </a>

    <a class="volver" href="index.html">
      ← PORTADA
    </a>

  </main>

  <div class="pie-pagina">
    Fe, memoria y tradición
  </div>

  <div class="reproductor-oculto" aria-hidden="true">
    <iframe
      id="reproductorPregon"
      title="Audio del pregón de Antonio Banderas"
      width="2"
      height="2"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <script>
    let pregonActivo = false;

    function reproducirPregon() {
      const reproductor = document.getElementById("reproductorPregon");
      const boton = document.getElementById("botonSonido");
      const estado = document.getElementById("estadoSonido");

      if (!pregonActivo) {
        reproductor.src =
          "https://www.youtube-nocookie.com/embed/-71YPdoL3ZU?autoplay=1&controls=1&rel=0";

        pregonActivo = true;
        boton.textContent = "■ Detener el pregón";
        estado.textContent =
          "El pregón se está iniciando. Si no se oye, utiliza el enlace de YouTube.";
      } else {
        reproductor.src = "about:blank";

        pregonActivo = false;
        boton.textContent = "▶ Escuchar el pregón";
        estado.textContent = "El sonido está detenido.";
      }
    }
  </script>

</body>
</html>
