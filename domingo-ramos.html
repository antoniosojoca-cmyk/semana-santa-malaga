
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Domingo de Ramos | Semana Santa de Málaga</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:#e9dfcc;
  font-family:Georgia,"Times New Roman",serif;
}

body{min-height:100vh}

.pagina{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:38px 18px 65px;
  background:#000;
}
.imagen-fondo{
  position:absolute;
  z-index:-2;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}


.imagen-fondo img{
  position:absolute;
  left:50%;
  top:50%;

  width:auto;
  height:min(78vh,790px);
  max-width:100%;

  object-fit:contain;
  object-position:center center;
  transform:translate(-50%,-50%);

  opacity:0;
  transition:opacity 1.8s ease;

  -webkit-mask-image:radial-gradient(
    ellipse 76% 75% at center,
    #000 35%,
    rgba(0,0,0,.92) 52%,
    rgba(0,0,0,.55) 70%,
    transparent 100%
  );

  mask-image:radial-gradient(
    ellipse 76% 75% at center,
    #000 35%,
    rgba(0,0,0,.92) 52%,
    rgba(0,0,0,.55) 70%,
    transparent 100%
  );
}

.imagen-fondo img.visible{
  opacity:.9;
}



  

  


  

.sombra{
  position:absolute;
  z-index:-1;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    #000 0%,
    rgba(0,0,0,.48) 20%,
    rgba(0,0,0,.08) 45%,
    rgba(0,0,0,.35) 70%,
    #000 100%
  );
}

.encabezado{
  width:100%;
  max-width:850px;
  text-align:center;
  margin-top:2vh;
}

.sobretitulo{
  color:#bba16b;
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
  margin:0 0 18px;
}

h1{
  color:#d4b779;
  font-size:clamp(27px,5vw,49px);
  font-weight:normal;
  letter-spacing:clamp(2px,.7vw,6px);
  line-height:1.25;
  text-transform:uppercase;
  margin:0;
  text-shadow:0 2px 18px #000;
}

.subtitulo{
  margin:17px 0 0;
  color:#e4d8c2;
  font-size:clamp(14px,2vw,18px);
  font-style:italic;
  text-shadow:0 2px 12px #000;
}

.espacio-imagen{
  flex:1;
  min-height:200px;
  width:100%;
}

.pie-imagen{
  color:#c4ac7a;
  font-size:12px;
  letter-spacing:2px;
  text-align:center;
  min-height:18px;
  margin:0 0 24px;
  text-shadow:0 2px 10px #000;
}

.audio{
  width:100%;
  max-width:540px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.boton-sonido{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(207,177,113,.7);
  border-radius:50%;
  color:#d7bd83;
  background:rgba(0,0,0,.75);
  font-family:Georgia,serif;
  font-size:19px;
  cursor:pointer;
  transition:background .25s,color .25s;
}

.boton-sonido:hover{
  color:#000;
  background:#cbb078;
}

.leyenda-audio{
  color:#c5b99f;
  font-size:12px;
  letter-spacing:1px;
  margin:12px 0 0;
}

.estado{
  color:#bba16b;
  font-size:12px;
  line-height:1.6;
  min-height:20px;
  margin:8px 0 0;
  max-width:430px;
}

.volver{
  position:absolute;
  bottom:23px;
  left:24px;
  color:#bba16b;
  font-size:11px;
  letter-spacing:2px;
  text-decoration:none;
}

.volver:hover{color:#f0d9a4}

.firma{
  position:absolute;
  bottom:23px;
  right:24px;
  color:#66583f;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

@media(max-width:600px){
  .pagina{padding:32px 15px 65px}
  .sobretitulo{letter-spacing:3px;font-size:10px}
  .imagen-fondo img{height:66vh;width:100%}
  .espacio-imagen{min-height:175px}
  .volver{left:15px;bottom:19px;font-size:10px}
  .firma{right:15px;bottom:19px;font-size:9px}
}

@media(prefers-reduced-motion:reduce){
  .imagen-fondo img{transition:none}
}
</style>
</head>

<body>
<main class="pagina">

  <div class="imagen-fondo" aria-hidden="true">
    <img id="fotoA" class="visible" src="" alt="">
    <img id="fotoB" src="" alt="">
  </div>

  <div class="sombra" aria-hidden="true"></div>

  <header class="encabezado">
    <p class="sobretitulo">Semana Santa de Málaga</p>
    <h1>Domingo de Ramos</h1>
    <p class="subtitulo">El comienzo de un camino de fe</p>
  </header>

  <div class="espacio-imagen" aria-hidden="true"></div>

  <p class="pie-imagen" id="nombreCofradia">
    Domingo de Ramos · Málaga
  </p>

  <section class="audio" aria-label="Oración del Domingo de Ramos">
    <button
      class="boton-sonido"
      id="botonSonido"
      type="button"
      aria-label="Escuchar oración"
      aria-pressed="false"
      title="Escuchar o detener la oración"
    >♪</button>

    <p class="leyenda-audio">Oración del Domingo de Ramos</p>

    <p class="estado" id="estadoSonido" aria-live="polite">
      Pulsa ♪ para escuchar la oración
    </p>
  </section>

  <a class="volver" href="index.html">← PORTADA</a>
  <div class="firma">Málaga · Semana Santa</div>

</main>

<script>
/*
  Fotografías de referencia.
  Si alguna dirección no carga, se puede sustituir por la URL
  de una fotografía pública y comprobada de la hermandad.
*/
const cofradias = [
  {
    nombre:"Pollinica",
    imagen:"https://static.grupojoly.com/clip/1202292f-3d41-45d0-b53e-d73767773dbe_source-aspect-ratio_1600w_0.webp"
  },
  {
    nombre:"Lágrimas y Favores",
    imagen:"https://i.pinimg.com/736x/92/a8/21/92a821cb2f72d1d02dd76df5cdd0aaa1.jpg"
  },
  {
    nombre:"Dulce Nombre",
    imagen:"https://i.pinimg.com/1200x/91/8f/24/918f24b70d0794e86544b2949e79111d.jpg"
  },
  {
    nombre:"Salutación",
    imagen:"https://static.grupojoly.com/clip/33835518-58e6-4d56-ba18-44e2295ba443_source-aspect-ratio_1600w_0.webp"
  },
  {
    nombre:"Humildad",
    imagen:"https://www.humildadypaciencia.org/wp-content/uploads/2023/08/image03014-683x1024.jpg"
  },
  {
    nombre:"Salud",
    imagen:"https://www.hermandaddelasalud.org/wp-content/uploads/2019/08/Salud-1024x683.jpg"
  },
  {
    nombre:"Huerto",
    imagen:"https://huertoydesamparados.com/wp-content/uploads/2023/09/012b-1023x1536.jpg"
  },
  {
    nombre:"Prendimiento",
    imagen:"https://static.grupojoly.com/clip/80e90b9c-c43b-46ef-b945-f5668d48c32f_source-aspect-ratio_1600w_0.webp"
  },
  {
    nombre:"Humildad y Paciencia",
    imagen:"https://www.humildadypaciencia.org/wp-content/uploads/2024/11/cultosnoviembre3.webp"
  }
];

const fotoA=document.getElementById("fotoA");
const fotoB=document.getElementById("fotoB");
const nombre=document.getElementById("nombreCofradia");

let indice=0;
let imagenActiva=0;
let temporizadorImagen=null;

function cambiarImagen(){
  const siguiente=(indice+1)%cofradias.length;
  const datos=cofradias[siguiente];
  const entrante=imagenActiva===0?fotoB:fotoA;
  const saliente=imagenActiva===0?fotoA:fotoB;

  const nuevaImagen=new Image();

  nuevaImagen.onload=()=>{
    entrante.src=datos.imagen;
    entrante.classList.add("visible");
    saliente.classList.remove("visible");

    nombre.textContent=datos.nombre;
    indice=siguiente;
    imagenActiva=imagenActiva===0?1:0;
  };

  nuevaImagen.onerror=()=>{
    indice=siguiente;
    // Si falla una foto, probar la siguiente sin romper el diseño.
  };

  nuevaImagen.src=datos.imagen;
}

function iniciarCarrusel(){
  const primera=new Image();

  primera.onload=()=>{
    fotoA.src=cofradias[0].imagen;
    fotoA.classList.add("visible");
    nombre.textContent=cofradias[0].nombre;

    temporizadorImagen=setInterval(cambiarImagen,6500);
  };

  primera.onerror=()=>{
    nombre.textContent="Semana Santa de Málaga";
    temporizadorImagen=setInterval(cambiarImagen,6500);
  };

  primera.src=cofradias[0].imagen;
}

iniciarCarrusel();

/* Oración original, recitada con la voz disponible en el navegador */
const oracion =
"Señor Jesús, hoy comienza tu camino por las calles de Málaga. " +
"Entre palmas, flores y miradas de esperanza, acompaña a quienes te siguen " +
"y consuela a quienes sufren. Que cada imagen nos acerque a tu amor " +
"y que esta Semana Santa nos enseñe a vivir con más fe, más humildad " +
"y más bondad. Amén.";

const boton=document.getElementById("botonSonido");
const estado=document.getElementById("estadoSonido");

let hablando=false;

function detenerOracion(){
  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  hablando=false;
  boton.textContent="♪";
  boton.setAttribute("aria-label","Escuchar oración");
  boton.setAttribute("aria-pressed","false");
  estado.textContent="Pulsa ♪ para escuchar la oración";
}

boton.addEventListener("click",()=>{
  if(!("speechSynthesis" in window)){
    estado.textContent=
      "Tu navegador no permite recitar la oración. Prueba con Chrome.";
    return;
  }

  if(hablando){
    detenerOracion();
    return;
  }

  window.speechSynthesis.cancel();

  const voz=new SpeechSynthesisUtterance(oracion);
  voz.lang="es-ES";
  voz.rate=0.84;
  voz.pitch=0.92;
  voz.volume=1;

  voz.onstart=()=>{
    hablando=true;
    boton.textContent="■";
    boton.setAttribute("aria-label","Detener oración");
    boton.setAttribute("aria-pressed","true");
    estado.textContent="Escuchando la oración…";
  };

  voz.onend=()=>{
    hablando=false;
    boton.textContent="♪";
    boton.setAttribute("aria-label","Escuchar oración");
    boton.setAttribute("aria-pressed","false");
    estado.textContent="Oración finalizada";
  };

  voz.onerror=()=>{
    hablando=false;
    boton.textContent="♪";
    boton.setAttribute("aria-pressed","false");
    estado.textContent="No se ha podido iniciar la voz. Inténtalo de nuevo.";
  };

  estado.textContent="Preparando la oración…";
  window.speechSynthesis.speak(voz);
});
</script>
</body>
</html>
