

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Domingo de Ramos | Semana Santa de Málaga</title>

  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #000;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #e9dfcc;
      font-family: Georgia, "Times New Roman", serif;
    }

    .pagina {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 45px 20px 65px;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }

    /* La fotografía se integra con el fondo negro */
    .imagen-fondo {
      position: absolute;
      z-index: -2;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .imagen-fondo img {
      display: block;
      width: min(100%, 1150px);
      height: min(78vh, 790px);
      object-fit: contain;
      object-position: center;
      opacity: 0.88;

      -webkit-mask-image:
        radial-gradient(
          ellipse 65% 53% at center,
          #000 43%,
          rgba(0,0,0,.85) 62%,
          transparent 100%
        );

      mask-image:
        radial-gradient(
          ellipse 65% 53% at center,
          #000 43%,
          rgba(0,0,0,.85) 62%,
          transparent 100%
        );
    }

    /* Oscuridad que permite leer los títulos */
    .sombra {
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          #000 0%,
          rgba(0,0,0,.55) 18%,
          rgba(0,0,0,.12) 43%,
          rgba(0,0,0,.35) 68%,
          #000 100%
        );
    }

    .encabezado {
      text-align: center;
      width: 100%;
      max-width: 850px;
      margin-top: 1vh;
    }

    .sobretitulo {
      color: #bba16b;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin: 0 0 19px;
    }

    h1 {
      color: #d4b779;
      font-weight: normal;
      font-size: clamp(27px, 5vw, 49px);
      letter-spacing: clamp(2px, .7vw, 6px);
      line-height: 1.25;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 2px 18px #000;
    }

    .subtitulo {
      margin: 18px 0 0;
      color: #e4d8c2;
      font-size: clamp(14px, 2vw, 18px);
      font-style: italic;
      text-shadow: 0 2px 12px #000;
    }

    .espacio-imagen {
      flex: 1;
      min-height: 210px;
      width: 100%;
    }

    .audio {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-top: 10px;
    }

    .boton-sonido {
      width: 43px;
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(207, 177, 113, .7);
      border-radius: 50%;
      color: #d7bd83;
      background: rgba(0,0,0,.7);
      font-family: Georgia, serif;
      font-size: 19px;
      cursor: pointer;
      transition: background .25s, color .25s, transform .25s;
    }

    .boton-sonido:hover {
      color: #000;
      background: #cbb078;
      transform: scale(1.05);
    }

    .boton-sonido:focus-visible {
      outline: 2px solid #d7bd83;
      outline-offset: 4px;
    }

    .leyenda-audio {
      color: #c5b99f;
      font-size: 12px;
      letter-spacing: 1px;
      margin: 12px 0 0;
    }

    .estado {
      color: #96866a;
      font-size: 11px;
      min-height: 16px;
      margin: 8px 0 0;
    }

    .volver {
      position: absolute;
      bottom: 25px;
      left: 25px;
      color: #bba16b;
      font-size: 11px;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .volver:hover {
      color: #f0d9a4;
    }

    .firma {
      position: absolute;
      bottom: 25px;
      right: 25px;
      color: #66583f;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .reproductor-oculto {
      position: fixed;
      width: 1px;
      height: 1px;
      overflow: hidden;
      left: -10px;
      bottom: 0;
      opacity: 0.001;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .pagina {
        padding: 35px 16px 70px;
      }

      .sobretitulo {
        letter-spacing: 3px;
        font-size: 10px;
      }

      .imagen-fondo img {
        width: 100%;
        height: 65vh;
      }

      .espacio-imagen {
        min-height: 190px;
      }

      .volver {
        left: 16px;
        bottom: 20px;
        font-size: 10px;
      }

      .firma {
        right: 16px;
        bottom: 20px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <div class="imagen-fondo" aria-hidden="true">
      <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/Pollinica_-_Trono_Padre_Jesus_2.jpg?width=1800"
        alt=""
        onerror="this.style.display='none';"
      >
    </div>

    <div class="sombra" aria-hidden="true"></div>

    <header class="encabezado">
      <p class="sobretitulo">Semana Santa de Málaga</p>

      <h1>Domingo de Ramos</h1>

      <p class="subtitulo">
        El comienzo de un camino de fe
      </p>
    </header>

    <div class="espacio-imagen" aria-hidden="true"></div>

    <section class="audio" aria-label="Audio de la jornada">

      <button
        class="boton-sonido"
        id="botonSonido"
        type="button"
        aria-label="Escuchar fragmento"
        aria-pressed="false"
        title="Escuchar o detener el audio"
      >♪</button>

      <p class="leyenda-audio">
        Voz y oración
      </p>

      <p class="estado" id="estadoSonido" aria-live="polite">
        Pulsa ♪ para escuchar
      </p>

    </section>

    <a class="volver" href="index.html">
      ← PORTADA
    </a>

    <div class="firma">
      Málaga · Semana Santa
    </div>

  </main>

  <div class="reproductor-oculto" aria-hidden="true">
    <iframe
      id="reproductorPregon"
      title="Audio de la Semana Santa"
      width="1"
      height="1"
      src="about:blank"
      allow="autoplay; encrypted-media"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <script>
    const VIDEO_ID = "-71YPdoL3ZU";

    /*
      Fragmento provisional de prueba: primeros 45 segundos.
      Lo sustituiremos por el pasaje adecuado cuando
      identifiquemos los minutos exactos del pregón.
    */
    const INICIO_FRAGMENTO = 0;
    const FIN_FRAGMENTO = 45;

    let reproduciendo = false;
    let temporizador = null;

    const reproductor = document.getElementById("reproductorPregon");
    const boton = document.getElementById("botonSonido");
    const estado = document.getElementById("estadoSonido");

    function detenerAudio() {
      reproductor.src = "about:blank";
      reproduciendo = false;

      if (temporizador !== null) {
        clearTimeout(temporizador);
        temporizador = null;
      }

      boton.textContent = "♪";
      boton.setAttribute("aria-label", "Escuchar fragmento");
      boton.setAttribute("aria-pressed", "false");
      estado.textContent = "Pulsa ♪ para escuchar";
    }

    function reproducirPregon() {
      if (reproduciendo) {
        detenerAudio();
        return;
      }

      reproduciendo = true;

      boton.textContent = "■";
      boton.setAttribute("aria-label", "Detener audio");
      boton.setAttribute("aria-pressed", "true");

      estado.textContent =
        "Intentando reproducir el fragmento seleccionado…";

      const parametros = new URLSearchParams({
        autoplay: "1",
        controls: "0",
        start: String(INICIO_FRAGMENTO),
        end: String(FIN_FRAGMENTO),
        rel: "0",
        playsinline: "1"
      });

      reproductor.src =
        "https://www.youtube-nocookie.com/embed/" +
        VIDEO_ID + "?" + parametros.toString();

      temporizador = setTimeout(() => {
        detenerAudio();
      }, (FIN_FRAGMENTO - INICIO_FRAGMENTO) * 1000 + 1500);
    }

    boton.addEventListener("click", reproducirPregon);
  </script>

</body>
</html>
